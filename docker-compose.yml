services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: qayd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong database admin password}
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD:?Set migration password}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set runtime password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qayd"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  migrate:
    build: { context: ., dockerfile: backend/Dockerfile, target: migrate }
    environment:
      DATABASE_URL: postgresql://qayd_migrator:${MIGRATION_PASSWORD}@db:5432/qayd
    depends_on: { db: { condition: service_healthy } }
    networks: [private]
    logging: *logging
  api:
    build: { context: ., dockerfile: backend/Dockerfile, target: runtime }
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://qayd_app:${APP_DB_PASSWORD}@db:5432/qayd
      APP_ORIGIN: https://${DOMAIN:?Set DOMAIN}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
    volumes: [private_files:/app/storage]
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [private, outbound]
    logging: *logging
  web:
    build: { context: ., dockerfile: Dockerfile }
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set TLS contact email}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: [caddy_data:/data, caddy_config:/config]
    depends_on: { api: { condition: service_healthy } }
    networks: [private, outbound]
    logging: *logging
networks:
  private: { internal: true }
  outbound: {}
volumes:
  postgres_data: {}
  private_files: {}
  caddy_data: {}
  caddy_config: {}
